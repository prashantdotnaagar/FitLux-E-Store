spring.application.name=estore-backend

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/fitluxdb
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


security.jwt.expiration-seconds=60
security.jwt.refresh-token.expiration-seconds=86400
security.jwt.secret=fitlux-super-secret-key-change-this

# App specific
app.encryption.secret=mySuperSecretEncryptionKey2024
